<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef0eb">
    <meta name="description" content="Procedurally generated Norwegian landscapes.">
    <title>Infinite Fjords</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23eef0eb' d='M0 0h64v64H0z'/%3E%3Cpath fill='none' stroke='%23304f5b' stroke-width='3' d='m5 45 18-28 10 16 8-22 18 34M5 52h54'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main>
      <canvas id="landscape" tabindex="0" aria-label="An endless Norwegian fjord landscape. Drag, scroll, or use the left and right arrow keys to explore."></canvas>
      <header class="masthead">
        <a class="wordmark" href="./" aria-label="Infinite Fjords, home">
          <svg viewBox="0 0 45 28" fill="none" aria-hidden="true"><path d="m1 23 12-17 9 13L31 2l13 21M1 27h43" stroke="currentColor" stroke-width="1.4"/><path d="m9 12 4 2 3-3m11-2 4 3 3-3" stroke="currentColor"/></svg>
          <span>Infinite Fjords</span>
        </a>
        <button id="about-open" class="text-button" aria-haspopup="dialog">About</button>
      </header>
      <div class="landscape-note" aria-hidden="true"><span id="place-name"></span></div>
      <footer class="toolbar">
        <div class="journey"><span class="compass" aria-hidden="true">N<span>↑</span></span><span id="distance">0.0 km</span></div>
        <nav class="explore" aria-label="Explore the landscape">
          <button id="go-left" class="icon-button" aria-label="Explore left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
          <span>Drag to explore</span>
          <button id="go-right" class="icon-button" aria-label="Explore right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
        </nav>
        <div class="actions">
          <button id="new-landscape" class="action-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 11-1l3 6M4 12l3 6a7 7 0 0 0 11-1"/></svg><span>New landscape</span></button>
          <button id="save" class="action-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v5h14v-5"/></svg><span>Save drawing</span></button>
        </div>
      </footer>
      <p id="status" role="status" aria-live="polite"></p>
      <dialog id="about" aria-labelledby="about-title">
        <button id="about-close" class="icon-button close" aria-label="Close about"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        <svg class="about-mountain" viewBox="0 0 120 65" fill="none" aria-hidden="true"><path d="m2 58 32-42 22 31L79 3l39 55M2 64h116M25 28l9 5 7-6m28-5 10 7 9-9" stroke="currentColor" stroke-width="1.3"/></svg>
        <h1 id="about-title">Infinite Fjords</h1>
        <p>Procedurally generated Norwegian landscapes.</p>
        <div class="instructions"><span>Drag or scroll to explore</span><span>← → to move · Home to return</span></div>
        <p class="credit">Inspired by <a href="https://github.com/LingDong-/shan-shui-inf" target="_blank" rel="noopener noreferrer">Ling Dong’s {Shan, Shui}*</a>.</p>
      </dialog>
      <noscript><p class="fallback">Enable JavaScript to view the landscape.</p></noscript>
    </main>
  </body>
</html>
